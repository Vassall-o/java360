<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script> 
    <!-- operadores -->
    const a = 20
    const b = a*2
    const c = a/2
    const d = a-2
    const e = a+2 
    alert("e: " + e)
    console.log(" e: " + e)
    const f = alert(a)+2
    alert("f"+ f )
    console.log("f"+ f)
    alert("a" + typeof a)
    alert("b" + typeof b)
    alert("c" + typeof c)
    alert("d" + typeof d)
    alert("e" + typeof e)
    alert("f" +  typeof f)

    </script>
    
</body>
</html>
